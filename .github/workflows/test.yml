name: tests

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PROXY_ROUTER_STRICT_HOST_INVARIANTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned sing-box runtime
        shell: bash
        env:
          SING_BOX_VERSION: '1.13.19'
          SING_BOX_SHA_ARM64: '23bf191906f2dfc9f00e9f0092f274f3426ba9377327e903ff94e636b64d0997'
          SING_BOX_SHA_AMD64: '31ee722237d95774e101fbffeae6be6776249c5f7db229ad8ff00b45b22e6a00'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64|aarch64)
              asset="sing-box-${SING_BOX_VERSION}-darwin-arm64.tar.gz"
              archive_root="sing-box-${SING_BOX_VERSION}-darwin-arm64"
              expected="$SING_BOX_SHA_ARM64"
              ;;
            x86_64|amd64)
              asset="sing-box-${SING_BOX_VERSION}-darwin-amd64.tar.gz"
              archive_root="sing-box-${SING_BOX_VERSION}-darwin-amd64"
              expected="$SING_BOX_SHA_AMD64"
              ;;
            *)
              echo "unsupported macOS runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            --retry 3 --output "$archive" \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${asset}"
          printf '%s  %s\n' "$expected" "$archive" | shasum -a 256 --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/$archive_root/sing-box"
          bin_dir="$RUNNER_TEMP/sing-box-bin"
          mkdir -p "$bin_dir"
          install -m 0755 "$RUNNER_TEMP/$archive_root/sing-box" "$bin_dir/sing-box"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/sing-box" version
      - name: Full pytest suite (seed 58)
        run: python -m pytest tests -q --randomly-seed=58
      - name: Full pytest suite (seed 5800)
        run: python -m pytest tests -q --randomly-seed=5800
