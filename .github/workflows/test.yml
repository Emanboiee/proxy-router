name: tests

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PROXY_ROUTER_STRICT_HOST_INVARIANTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Full pytest suite (seed 58)
        run: python -m pytest tests -q --randomly-seed=58
      - name: Full pytest suite (seed 5800)
        run: python -m pytest tests -q --randomly-seed=5800
