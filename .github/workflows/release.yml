name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sing-box-version:
        description: 'sing-box version to bundle in the archives'
        required: false
        default: '1.13.19'

permissions:
  contents: write

env:
  SING_BOX_VERSION: ${{ github.event.inputs.sing-box-version || '1.13.19' }}
  # Pinned commit SHAs (mutable major tags are a supply-chain risk; the tag
  # comment records which version the SHA resolves to).
  #   actions/checkout@v4.2.2
  #   actions/setup-python@v5.6.0
  #   actions/upload-artifact@v4.6.2
  #   actions/download-artifact@v4.3.0
  #   softprops/action-gh-release@v2.3.2

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: darwin-arm64
            suffix: darwin-arm64
            archive: tar.gz
            exe: sing-box
          # Intel runner pool (macos-13) is heavily backlogged on GH; the
          # darwin-amd64 bundle is download-only (never executed), so it can
          # be assembled on any macOS runner.
          - os: macos-15
            asset: darwin-amd64
            suffix: darwin-amd64
            archive: tar.gz
            exe: sing-box
          - os: ubuntu-24.04
            asset: linux-amd64-glibc
            suffix: linux-amd64
            archive: tar.gz
            exe: sing-box
          - os: windows-latest
            asset: windows-amd64
            suffix: windows-amd64
            archive: zip
            exe: sing-box.exe

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Download + checksum-verify the engine, assert its architecture, copy
      # the runtime file manifest and write the archive. Extracted from this
      # workflow into a helper so the pull request Windows smoke job assembles
      # the byte-for-byte same bundle instead of a hand-copied manifest.
      - name: Assemble release bundle
        run: ./.github/scripts/assemble-release-bundle.sh "${{ matrix.asset }}" "${{ matrix.suffix }}" "${{ matrix.archive }}" "${{ matrix.exe }}" "$GITHUB_REF_NAME"

      - name: Clean-install smoke test (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Install the EXACT published archive into a throwaway prefix. A
          # missing archive or an install that cannot run is a hard failure.
          rm -rf /tmp/proxy-router
          tar -xzf "proxy-router-${GITHUB_REF_NAME}-${{ matrix.suffix }}.tar.gz" -C /tmp
          [ -d /tmp/proxy-router ] || { echo "error: archive did not contain proxy-router/" >&2; exit 1; }
          export PROXY_ROUTER_DIR="$(mktemp -d)/prefix"
          /tmp/proxy-router/install.sh >/dev/null
          status_json=$("$PROXY_ROUTER_DIR/current/router.py" status --json || true)
          printf '%s' "$status_json" | python3 -c "import json,sys; json.load(sys.stdin)"
          "$PROXY_ROUTER_DIR/current/router.py" --help >/dev/null
          echo "clean-install CLI smoke passed"

      - name: Set up Python for the Windows smoke test
        if: runner.os == 'Windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Clean-install smoke test (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Install the EXACT published zip into a throwaway LOCALAPPDATA and
          # run the installed launchers; see issue #67 criterion 6.
          $archive = Join-Path (Get-Location) "proxy-router-${env:GITHUB_REF_NAME}-${{ matrix.suffix }}.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "release archive not found: $archive"
          }
          & "$env:GITHUB_WORKSPACE/.github/scripts/windows-release-smoke.ps1" -Archive $archive

      - name: Generate project checksums
        id: checksums
        shell: bash
        run: |
          set -euo pipefail
          f="proxy-router-${GITHUB_REF_NAME}-${{ matrix.suffix }}.${{ matrix.archive }}"
          sha256sum "$f" > "$f.sha256"
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-${{ matrix.suffix }}
          path: |
            proxy-router-${{ github.ref_name }}-${{ matrix.suffix }}.${{ matrix.archive }}
            proxy-router-${{ github.ref_name }}-${{ matrix.suffix }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  dashboard:
    name: dashboard macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Install Playwright browser
        working-directory: dashboard
        run: npx playwright install chromium

      - name: Run dashboard checks
        working-directory: dashboard
        run: |
          npm run build
          npm test
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          npm run tauri -- build --bundles app

      - name: Verify and archive app bundle
        run: |
          set -euo pipefail
          app="dashboard/src-tauri/target/release/bundle/macos/Proxy Router.app"
          executable="$app/Contents/MacOS/proxy-router-dashboard"
          test -x "$executable"
          file "$executable"
          archive="proxy-router-dashboard-$GITHUB_REF_NAME-darwin-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-dashboard
          path: |
            proxy-router-dashboard-${{ github.ref_name }}-darwin-arm64.zip
            proxy-router-dashboard-${{ github.ref_name }}-darwin-arm64.zip.sha256
          if-no-files-found: error


  dashboard-windows:
    name: Windows desktop build and smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Install Playwright browser
        working-directory: dashboard
        run: npx playwright install chromium
      - name: Build frontend
        working-directory: dashboard
        run: npm run build
      - name: Run browser tests
        working-directory: dashboard
        run: npm test
      - name: Run native tests
        run: cargo test --locked --manifest-path dashboard/src-tauri/Cargo.toml
      - name: Build Windows installer
        working-directory: dashboard
        run: npm run tauri -- build --bundles nsis
      - name: Verify and archive Windows artifacts
        shell: pwsh
        run: |
          $exe = 'dashboard/src-tauri/target/release/proxy-router-dashboard.exe'
          if (!(Test-Path $exe)) { throw 'Missing Windows executable' }
          $installers = Get-ChildItem dashboard/src-tauri/target/release/bundle/nsis/*.exe
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $archive = "proxy-router-dashboard-$env:GITHUB_REF_NAME-windows-amd64.zip"
          Compress-Archive -Path $installers.FullName -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bundle-dashboard-windows
          path: proxy-router-dashboard-*-windows-amd64.zip*
          if-no-files-found: error

  source:
    name: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build source tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/proxy-router
          cp router.py setup_tui.py monitor.py network_control.py route_watcher.py proxy_tray.py domain_autodetect.py egress.py state.py config_schema.py worker_lock.py providers_check.py net_safety.py model_relay.py status_snapshot.py dashboard_profile_manager.py provider_lifecycle.py README.md LICENSE .gitignore router.example.json pyproject.toml requirements-dev.txt dist/proxy-router/
          cp -R tests examples guides rulesets install.sh install.ps1 .github dashboard dist/proxy-router/
          cp privileged_helper.py privileged_installer.py sing-box-release.json VERSION dist/proxy-router/
          tar -czf "proxy-router-${GITHUB_REF_NAME}-source.tar.gz" -C dist proxy-router

      - name: Upload source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-source
          path: proxy-router-${{ github.ref_name }}-source.tar.gz
          if-no-files-found: error

  test-gate:
    name: full pytest gate for tagged SHA
    runs-on: macos-15
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Full pytest suite
        run: python -m pytest tests -q

  publish:
    name: publish release (gated)
    needs: [build, dashboard, dashboard-windows, source, test-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: dist
      - name: Verify every expected artifact is present
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          for f in \
            proxy-router-${GITHUB_REF_NAME}-darwin-arm64.tar.gz \
            proxy-router-${GITHUB_REF_NAME}-darwin-amd64.tar.gz \
            proxy-router-${GITHUB_REF_NAME}-linux-amd64.tar.gz \
            proxy-router-${GITHUB_REF_NAME}-windows-amd64.zip \
            proxy-router-${GITHUB_REF_NAME}-source.tar.gz \
            proxy-router-dashboard-${GITHUB_REF_NAME}-darwin-arm64.zip \
            proxy-router-dashboard-${GITHUB_REF_NAME}-darwin-arm64.zip.sha256 \
            proxy-router-dashboard-${GITHUB_REF_NAME}-windows-amd64.zip \
            proxy-router-dashboard-${GITHUB_REF_NAME}-windows-amd64.zip.sha256; do
            [ -f "dist/$f" ] || { echo "missing artifact: $f" >&2; exit 1; }
          done
          count=$(find dist -name '*.tar.gz' -o -name '*.zip' | wc -l | tr -d ' ')
          [ "$count" -eq 7 ] || { echo "expected 7 release archives, found $count" >&2; exit 1; }
          echo "artifact archives: $count"
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
