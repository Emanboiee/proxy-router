# Pull request gate for the Windows release bundle (issue #67).
#
# The release workflow only runs on tags and workflow_dispatch, and dispatching
# it PUBLISHES a release -- so it can never be used to validate a PR. This
# workflow assembles the exact same bundle through the shared helper
# (.github/scripts/assemble-release-bundle.sh), installs it with the bundle's
# own install.ps1 and exercises the installed launchers, without any release
# or write permission: it is structurally incapable of publishing anything.
name: windows-smoke

on:
  pull_request:

permissions:
  contents: read

env:
  SING_BOX_VERSION: '1.13.19'

defaults:
  run:
    shell: bash

jobs:
  windows-installer-smoke:
    name: assemble + clean-install smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Same helper release.yml runs for every matrix target: engine download
      # + checksum verification, arch/version assert, runtime file manifest,
      # zip. No GITHUB_REF_NAME on pull requests, so the PR sha names the zip.
      - name: Assemble release bundle (shared with release)
        run: ./.github/scripts/assemble-release-bundle.sh windows-amd64 windows-amd64 zip sing-box.exe "$GITHUB_SHA"

      - name: Set up Python for the Windows smoke test
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Installs the EXACT assembled zip into a throwaway LOCALAPPDATA and
      # runs the installed launchers, including nonzero exit-code propagation
      # through cmd.exe for both launcher branches.
      - name: Clean-install smoke test (windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path (Get-Location) "proxy-router-$env:GITHUB_SHA-windows-amd64.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "release archive not found: $archive"
          }
          & "$env:GITHUB_WORKSPACE/.github/scripts/windows-release-smoke.ps1" -Archive $archive
