name: dashboard

on:
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
      - ".github/workflows/release.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
      - ".github/workflows/release.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  dashboard:
    name: dashboard macOS build and smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check dashboard build inputs
        id: dashboard_inputs
        run: |
          missing=0
          for source in \
            dashboard/package-lock.json \
            dashboard/src-tauri/Cargo.toml \
            dashboard/src-tauri/Cargo.lock \
            dashboard/src-tauri/build.rs \
            dashboard/src-tauri/tauri.conf.json \
            dashboard/src/status.json \
            dashboard/public/gremlin-cat-goblin-cat.gif \
            dashboard/src-tauri/icons/icon.icns \
            dashboard/src-tauri/icons/icon.ico \
            dashboard/src-tauri/icons/icon.png; do
            if [ ! -f "$source" ]; then
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dashboard clean-build inputs are incomplete; skipping until the required source manifests and assets are committed."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.dashboard_inputs.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Rust
        if: steps.dashboard_inputs.outputs.ready == 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Install dashboard dependencies
        if: steps.dashboard_inputs.outputs.ready == 'true'
        working-directory: dashboard
        run: npm ci

      - name: Install Playwright browser
        if: steps.dashboard_inputs.outputs.ready == 'true'
        working-directory: dashboard
        run: npx playwright install chromium

      - name: Build frontend
        if: steps.dashboard_inputs.outputs.ready == 'true'
        working-directory: dashboard
        run: npm run build

      - name: Run browser tests
        if: steps.dashboard_inputs.outputs.ready == 'true'
        working-directory: dashboard
        run: npm test

      - name: Run Rust tests
        if: steps.dashboard_inputs.outputs.ready == 'true'
        run: cargo test --locked --manifest-path dashboard/src-tauri/Cargo.toml

      - name: Build macOS app
        if: steps.dashboard_inputs.outputs.ready == 'true'
        working-directory: dashboard
        run: npm run tauri -- build --bundles app

      - name: Verify and archive app bundle
        if: steps.dashboard_inputs.outputs.ready == 'true'
        run: |
          set -euo pipefail
          app="dashboard/src-tauri/target/release/bundle/macos/Proxy Router.app"
          executable="$app/Contents/MacOS/proxy-router-dashboard"
          test -x "$executable"
          file "$executable"
          ditto -c -k --sequesterRsrc --keepParent "$app" proxy-router-dashboard-ci-macos-arm64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.dashboard_inputs.outputs.ready == 'true'
        with:
          name: proxy-router-dashboard-ci-macos-arm64
          path: proxy-router-dashboard-ci-macos-arm64.zip
          if-no-files-found: error
